<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RA hub - File Manager</title>
    <!-- Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(22, 31, 48, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #000 url('imgs/wallpaper.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* হেডার ও সার্চ বার */
        .header-bar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            gap: 1rem;
            flex-wrap: wrap;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-green);
            text-decoration: none;
        }

        .search-sort-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            max-width: 600px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            outline: none;
        }

        .sort-select {
            padding: 0.6rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            outline: none;
            cursor: pointer;
        }

        .sort-select option {
            background: #1e293b;
            color: #fff;
        }

        /* ক্যাটাগরি ফোল্ডার ফিল্টার */
        .folder-filter-bar {
            padding: 0.8rem 2rem;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            border-bottom: 1px solid var(--card-border);
        }

        .filter-btn {
            padding: 0.5rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
        }

        /* ফাইল লিস্ট গ্রিড */
        .file-workspace {
            flex: 1;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            align-content: start;
        }

        .file-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s ease;
        }

        .file-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            overflow: hidden;
        }

        .file-icon {
            font-size: 1.8rem;
            color: var(--accent-blue);
        }

        .file-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-name {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* ৩-ডট ড্রপডাউন মেনু */
        .menu-container {
            position: relative;
        }

        .dots-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 50%;
        }

        .dots-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 170px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-green);
        }

        .dropdown-item.delete:hover {
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.15);
        }

        /* নোটিফিকেশন লোডার */
        .loading-text {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-sub);
            font-size: 1.1rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <!-- হেডার বার -->
    <header class="header-bar">
        <a href="manu.html" class="brand-title">
            <i class="fa-solid fa-arrow-left"></i>
            <span>RA File Hub</span>
        </a>

        <div class="search-sort-container">
            <!-- সার্চ ইনপুট -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ফাইল খুঁজুন...">
            </div>

            <!-- শর্টিং ড্রপডাউন (A-Z, Z-A, Time) -->
            <select id="sortSelect" class="sort-select">
                <option value="time">Time (নতুনের ক্রমানুসারে)</option>
                <option value="az">A - Z (বর্ণানুক্রমিক)</option>
                <option value="za">Z - A (বিপরীত)</option>
            </select>
        </div>
    </header>

    <!-- ফোল্ডার ও টাইপ ফিল্টার বার -->
    <nav class="folder-filter-bar">
        <button class="filter-btn active" onclick="filterCategory('all')">All Files</button>
        <button class="filter-btn" onclick="filterCategory('image')">Images</button>
        <button class="filter-btn" onclick="filterCategory('video')">Videos</button>
        <button class="filter-btn" onclick="filterCategory('audio')">Audio</button>
        <button class="filter-btn" onclick="filterCategory('document')">Documents</button>
    </nav>

    <!-- ফাইল ডিসপ্লে এরিয়া -->
    <main class="file-workspace" id="fileWorkspace">
        <div class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ফাইল লোড হচ্ছে...</div>
    </main>

    <script>
        // সুরক্ষিত সিস্টেম ফাইল যা ফাইল ম্যানেজারে হাইড থাকবে
        const PROTECTED_FILES = ['index.html', 'manu.html', 'setting.html', 'Flappybird.html', 'Powershooter.html', 'Tiktock.html', 'app.js'];

        let allFetchedFiles = [];
        let currentCategory = 'all';

        // localStorage থেকে ডিফল্ট কনফিগারেশন নেওয়া
        const config = {
            user: localStorage.getItem('gh_user') || 'mdakash200',
            repo: localStorage.getItem('gh_repo') || 'Moviebox',
            token: localStorage.getItem('gh_token') || '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'
        };

        // গিটহাব থেকে সরাসরি ফাইল আনার ফাংশন
        async function fetchGithubFiles() {
            const workspace = document.getElementById('fileWorkspace');
            try {
                const response = await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents`, {
                    headers: { 'Authorization': `Bearer ${config.token}` }
                });

                if (!response.ok) throw new Error('গিটহাব থেকে ফাইল আনা সম্ভব হয়নি।');

                const files = await response.json();
                
                // সিস্টেম ফাইল ফিল্টার করে হাইড করা
                allFetchedFiles = files.filter(file => !PROTECTED_FILES.includes(file.name));
                
                renderFiles();
            } catch (error) {
                workspace.innerHTML = `<div class="loading-text" style="color:var(--accent-red);"><i class="fa-solid fa-triangle-exclamation"></i> ত্রুটি: ${error.message}</div>`;
            }
        }

        // ফাইল রেন্ডারিং ও ফিল্টারিং
        function renderFiles() {
            const workspace = document.getElementById('fileWorkspace');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = allFetchedFiles.filter(file => {
                const matchesSearch = file.name.toLowerCase().includes(searchQuery);
                const ext = file.name.split('.').pop().toLowerCase();

                let matchesCat = true;
                if (currentCategory === 'image') matchesCat = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
                else if (currentCategory === 'video') matchesCat = ['mp4', 'mkv', 'webm', 'avi'].includes(ext);
                else if (currentCategory === 'audio') matchesCat = ['mp3', 'wav', 'ogg'].includes(ext);
                else if (currentCategory === 'document') matchesCat = ['pdf', 'txt', 'doc', 'docx', 'zip'].includes(ext);

                return matchesSearch && matchesCat;
            });

            // শর্টিং লজিক
            if (sortBy === 'az') filtered.sort((a, b) => a.name.localeCompare(b.name));
            else if (sortBy === 'za') filtered.sort((a, b) => b.name.localeCompare(a.name));

            if (filtered.length === 0) {
                workspace.innerHTML = `<div class="loading-text">কোনো ফাইল পাওয়া যায়নি।</div>`;
                return;
            }

            workspace.innerHTML = filtered.map((file, index) => {
                return `
                    <div class="file-card">
                        <div class="file-info">
                            <i class="${getFileIcon(file.name)} file-icon"></i>
                            <div class="file-details">
                                <span class="file-name" title="${file.name}">${file.name}</span>
                                <span class="file-size">${(file.size / 1024).toFixed(1)} KB</span>
                            </div>
                        </div>

                        <!-- ৩-ডট মেনু -->
                        <div class="menu-container">
                            <button class="dots-btn" onclick="toggleMenu(event, ${index})"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            <div class="dropdown-menu" id="menu-${index}">
                                <button class="dropdown-item" onclick="actionOpen('${file.download_url}')"><i class="fa-solid fa-folder-open"></i> Open</button>
                                <button class="dropdown-item" onclick="actionRename('${file.name}', '${file.sha}')"><i class="fa-solid fa-pen-to-square"></i> Rename</button>
                                <button class="dropdown-item" onclick="actionShare('${file.download_url}')"><i class="fa-solid fa-share-nodes"></i> Share</button>
                                <button class="dropdown-item" onclick="actionDetails('${file.name}', '${file.size}', '${file.path}')"><i class="fa-solid fa-circle-info"></i> Details</button>
                                <button class="dropdown-item" onclick="actionDownload('${file.download_url}')"><i class="fa-solid fa-download"></i> Download</button>
                                <button class="dropdown-item delete" onclick="actionDelete('${file.name}', '${file.sha}')"><i class="fa-solid fa-trash-can"></i> Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ফাইল এক্সটেনশন আইকন
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'fa-solid fa-image';
            if (['mp4', 'mkv', 'webm'].includes(ext)) return 'fa-solid fa-file-video';
            if (['mp3', 'wav'].includes(ext)) return 'fa-solid fa-file-audio';
            if (['pdf', 'doc', 'txt'].includes(ext)) return 'fa-solid fa-file-lines';
            return 'fa-solid fa-file';
        }

        // ড্রপডাউন টগল
        function toggleMenu(e, index) {
            e.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            document.getElementById(`menu-${index}`).classList.toggle('show');
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        });

        // ক্যাটাগরি ফিল্টার
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderFiles();
        }

        // ৩-ডট অ্যাকশনসমূহ (Actions)
        function actionOpen(url) { window.open(url, '_blank'); }
        function actionDownload(url) { window.open(url, '_blank'); }
        
        function actionShare(url) {
            navigator.clipboard.writeText(url);
            alert('ফাইল লিংক কপি করা হয়েছে!');
        }

        function actionDetails(name, size, path) {
            alert(`ফাইল নাম: ${name}\nসাইজ: ${(size / 1024).toFixed(2)} KB\nপাথ: ${path}`);
        }

        function actionRename(oldName, sha) {
            const newName = prompt("নতুন ফাইলের নাম দিন:", oldName);
            if (newName && newName !== oldName) {
                alert(`গিটহাব API এর মাধ্যমে '${oldName}' পরিবর্তন করে '${newName}' করা হচ্ছে...`);
            }
        }

        async function actionDelete(fileName, sha) {
            if (confirm(`আপনি কি নিশ্চিতভাবে '${fileName}' ফাইলটি মুছে ফেলতে চান?`)) {
                try {
                    const response = await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/${fileName}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ message: `Delete ${fileName}`, sha: sha })
                    });
                    if (response.ok) {
                        alert('ফাইলটি সফলভাবে মুছে ফেলা হয়েছে!');
                        fetchGithubFiles();
                    } else {
                        alert('ডিলিট করা সম্ভব হয়নি।');
                    }
                } catch (err) {
                    alert('ত্রুটি: ' + err.message);
                }
            }
        }

        // সার্চ ও শর্ট ইভেন্ট
        document.getElementById('searchInput').addEventListener('input', renderFiles);
        document.getElementById('sortSelect').addEventListener('change', renderFiles);

        // পেজ লোড হলে ফাইল ড্রপ করা
        document.addEventListener('DOMContentLoaded', fetchGithubFiles);
    </script>
</body>
</html>
