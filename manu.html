<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RA hub</title>
    <!-- Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #090d16;
            --card-border: rgba(255, 255, 255, 0.15);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --taskbar-bg: rgba(15, 23, 42, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

body {
    /* $1200 \times 800$ রেজুলেশনের ওয়ালপেপার পারফেক্টভাবে দেখানোর জন্য */
    background-color: #090d16;
    background-image: url('imgs/wallpaper.gif');
    background-repeat: no-repeat;
    background-position: center center;
    background-size: 100% 100%; /* অথবা cover ব্যবহার করতে পারো */
    background-attachment: fixed;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--text-main);
    position: relative;
}


        /* ডেক্সটপ এরিয়া - আইকনগুলো এক সাইডে (বামপাশে) ছোট হয়ে থাকবে */
        .desktop-workspace {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start; /* বামপাশে সাজানো থাকবে */
            gap: 1.2rem 1rem;
            max-height: calc(100vh - 65px); /* টাস্কবারের ওপর পর্যন্ত */
            z-index: 10;
        }
/* ট্রান্সপারেন্ট (স্বচ্ছ) বটম টাস্কবার */
.desktop-taskbar {
    height: 55px;
    background: rgba(15, 23, 42, 0.25); /* ০.২৫ মান দেওয়াতে ব্যাকগ্রাউন্ডের ওয়ালপেপারটি স্পষ্ট দেখা যাবে */
    backdrop-filter: blur(10px); /* হালকা ব্লার এফেক্ট যা একটা গ্লাস লুক দেবে */
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    z-index: 100;
}

        .app-shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-main);
            width: 85px;
            padding: 0.5rem;
            border-radius: 12px;
            transition: all 0.2s ease;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .app-shortcut:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* ছোট সাইজের অ্যাপ আইকন */
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            margin-bottom: 0.4rem;
        }

        .app-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.2px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            word-break: break-word;
        }

        /* ব্যাকগ্রাউন্ড কালার কাস্টম অ্যাপস */
        .playstore-bg { background: linear-gradient(135deg, #01875f, #005f42); color: #fff; }
        .youtube-bg { background: linear-gradient(135deg, #ff0000, #990000); color: #fff; }
        .filemanager-bg { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
        .gallery-bg { background: linear-gradient(135deg, #f59e0b, #b45309); color: #fff; }
        .facebook-bg { background: linear-gradient(135deg, #1877f2, #0d52ab); color: #fff; }
        .game1-bg { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }
        .game2-bg { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }

        /* স্লাইড-আউট সাইডবার মেনু */
        .sidebar-drawer {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid var(--card-border);
            z-index: 1000;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar-drawer.active {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 1.5rem;
        }

        .drawer-title {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--accent-green);
        }

        .btn-close-drawer {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .btn-close-drawer:hover {
            color: var(--accent-red);
        }

        .drawer-menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .drawer-menu-item a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1.2rem;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.04);
        }

        .drawer-menu-item a:hover {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            transform: translateX(5px);
        }

        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            z-index: 999;
            display: none;
        }

        .drawer-overlay.active {
            display: block;
        }

        /* বটম টাস্কবার (Windows Style) */
        .desktop-taskbar {
            height: 55px;
            background: var(--taskbar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 100;
        }

        .menu-trigger-btn {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(59, 130, 246, 0.3));
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-trigger-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            transform: scale(1.05);
        }

        /* রানিং লিংক অ্যাপস (ছোট গোল আইকন) */
        .taskbar-apps {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .round-app-link {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .round-app-link:hover {
            background: var(--accent-blue);
            color: #ffffff;
            transform: translateY(-2px) scale(1.1);
        }

        .taskbar-clock {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            padding: 0.4rem 0.9rem;
            border-radius: 15px;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <!-- ডেস্কটপ ওয়ার্কস্পেস (আইকনগুলো বামপাশে সাজানো) -->
    <main class="desktop-workspace">
        
        <!-- Google Play Store -->
        <a href="https://play.google.com" target="_blank" class="app-shortcut">
            <div class="app-icon playstore-bg"><i class="fa-brands fa-google-play"></i></div>
            <span class="app-title">Play Store</span>
        </a>

        <!-- YouTube -->
        <a href="https://youtube.com" target="_blank" class="app-shortcut">
            <div class="app-icon youtube-bg"><i class="fa-brands fa-youtube"></i></div>
            <span class="app-title">YouTube</span>
        </a>

        <!-- File Manager -->
        <a href="file.html" class="app-shortcut">
            <div class="app-icon filemanager-bg"><i class="fa-solid fa-folder-closed"></i></div>
            <span class="app-title">File </span>
        </a>

        <!-- Photos Library -->
        <a href="photo.html" class="app-shortcut">
            <div class="app-icon gallery-bg"><i class="fa-solid fa-images"></i></div>
            <span class="app-title">Photos</span>
        </a>

        <!-- Facebook -->
        <a href="https://facebook.com" target="_blank" class="app-shortcut">
            <div class="app-icon facebook-bg"><i class="fa-brands fa-facebook"></i></div>
            <span class="app-title">Facebook</span>
        </a>

        <!-- Flappybird Game -->
        <a href="toktik.html" class="app-shortcut">
            <div class="app-icon game1-bg"><i class="fa-solid fa-kiwi-bird"></i></div>
            <span class="app-title">Tok Tik</span>
        </a>

        <!-- Powershooter Game -->
        <a href="powershooter.html" class="app-shortcut">
            <div class="app-icon game2-bg"><i class="fa-solid fa-crosshairs"></i></div>
            <span class="app-title">Shooter</span>
        </a>

    </main>

    <!-- ব্যাকড্রপ -->
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <!-- সাইডবার মেনু -->
    <aside class="sidebar-drawer" id="sidebarDrawer">
        <div class="drawer-header">
            <div class="drawer-title">
                <i class="fa-solid fa-border-all"></i>
                <span>RA hub Menu</span>
            </div>
            <button class="btn-close-drawer" id="closeDrawerBtn">&times;</button>
        </div>

        <ul class="drawer-menu-list">
            <li class="drawer-menu-item">
                <a href="setting.html">
                    <i class="fa-solid fa-gear" style="color: var(--accent-blue);"></i>
                    <span>Settings</span>
                </a>
            </li>
            <li class="drawer-menu-item">
                <a href="https://google.com" target="_blank">
                    <i class="fa-brands fa-google" style="color: #4285F4;"></i>
                    <span>Google</span>
                </a>
            </li>

            
                        <li class="drawer-menu-item">
                <a href="https://www.crazygames.com/" target="_blank">
                   <img src="https://img.icons8.com/3d-fluency/94/game-controller.png" alt="" /> 
                    <span>Game online</span>
                </a>
            </li>
        </ul>
        
    </aside>

    <!-- বটম টাস্কবার -->
    <footer class="desktop-taskbar
">
        <button class="menu-trigger-btn" id="openDrawerBtn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="taskbar-apps">
            <a href="https://weather.com" target="_blank" class="round-app-link" title="Weather"><i class="fa-solid fa-cloud-sun"></i></a>
            <a href="https://news.google.com" target="_blank" class="round-app-link" title="News"><i class="fa-solid fa-newspaper"></i></a>
            <a href="https://maps.google.com" target="_blank" class="round-app-link" title="Maps"><i class="fa-solid fa-map-location-dot"></i></a>
            <a href="https://time.is" target="_blank" class="round-app-link" title="Clock"><i class="fa-solid fa-clock"></i></a>
            <a href="https://www.calculator.net" target="_blank" class="round-app-link" title="Calculator"><i class="fa-solid fa-calculator"></i></a>
        </div>

        <div class="taskbar-clock" id="liveClock">00:00 PM</div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const openDrawerBtn = document.getElementById('openDrawerBtn');
            const closeDrawerBtn = document.getElementById('closeDrawerBtn');
            const sidebarDrawer = document.getElementById('sidebarDrawer');
            const drawerOverlay = document.getElementById('drawerOverlay');
            const liveClock = document.getElementById('liveClock');

            function openDrawer() {
                sidebarDrawer.classList.add('active');
                drawerOverlay.classList.add('active');
            }

            function closeDrawer() {
                sidebarDrawer.classList.remove('active');
                drawerOverlay.classList.remove('active');
            }

            openDrawerBtn.addEventListener('click', openDrawer);
            closeDrawerBtn.addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);

            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                liveClock.textContent = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
            }

            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
